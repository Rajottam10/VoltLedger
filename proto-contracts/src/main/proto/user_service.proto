syntax = "proto3";

package voltledger.user;

option java_multiple_files = true;
option java_package= "io.voltledger.proto.user";

service UserService {
  rpc GetUserByEmail(GetUserByEmailRequest) returns (UserResponse);
}

message GetUserByEmailRequest {
  string email =1;
}

message UserResponse {
  int64 id =1;
  string first_name =2;
  string last_name =3;
  string email =4;
  string mobile_number= 5;
  string address=6;
  Roles role=7;
  Status status =8;
}

message Roles {
  int64 id=1;
  string name =2;
  string description =3;
}

message Status {
  int64 id=1;
  string name =2;
  string description =3;
}